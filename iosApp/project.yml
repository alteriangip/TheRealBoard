# Generates RefBoard.xcodeproj with XcodeGen (`xcodegen generate`).
# The app itself is the shared Kotlin code, built first as Shared.framework.
name: RefBoard
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  RefBoard:
    type: application
    platform: iOS
    sources: [RefBoard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.refboard.app
        PRODUCT_NAME: RefBoard
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"]
        OTHER_LDFLAGS: ["-framework", "Shared", "-lc++"]
        ENABLE_BITCODE: NO
        # Signed later by SideStore / LiveContainer.
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: RefBoard/Info.plist
      properties:
        CFBundleDisplayName: RefBoard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        # Downloads and backups show up in Files › On My iPad › RefBoard.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Smooth 120 Hz scrolling on ProMotion iPads.
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
