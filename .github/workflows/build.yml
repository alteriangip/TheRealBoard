name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REFBOARD_KEYSTORE_PASSWORD: ${{ secrets.REFBOARD_KEYSTORE_PASSWORD }}
      REFBOARD_KEY_ALIAS: ${{ secrets.REFBOARD_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a matching Python on the build machine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: sign with a key kept in repository secrets instead of the
      # one in keystore/. Without the secret, the committed key is used.
      - name: Load signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.REFBOARD_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/refboard.jks"
          echo "REFBOARD_KEYSTORE_FILE=$RUNNER_TEMP/refboard.jks" >> "$GITHUB_ENV"

      # The release build is optimised (R8) and runs noticeably smoother;
      # the debug build is kept as a fallback.
      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RefBoard-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RefBoard-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # iPad / iPhone app: an unsigned .ipa for SideStore or LiveContainer,
  # which sign it on the device.
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Android module (with Python) is configured too, even though only
      # the shared framework is built here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build shared framework
        run: gradle :shared:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build app (unsigned)
        run: |
          cd iosApp
          xcodebuild -project RefBoard.xcodeproj -target RefBoard \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R iosApp/build/Release-iphoneos/RefBoard.app Payload/
          zip -qry RefBoard.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RefBoard-ipa
          path: RefBoard.ipa
