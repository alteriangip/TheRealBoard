name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REFBOARD_KEYSTORE_PASSWORD: ${{ secrets.REFBOARD_KEYSTORE_PASSWORD }}
      REFBOARD_KEY_ALIAS: ${{ secrets.REFBOARD_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy needs a matching Python on the build machine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Optional: sign with a key kept in repository secrets instead of the
      # one in keystore/. Without the secret, the committed key is used.
      - name: Load signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.REFBOARD_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/refboard.jks"
          echo "REFBOARD_KEYSTORE_FILE=$RUNNER_TEMP/refboard.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RefBoard-apk
          path: app/build/outputs/apk/debug/*.apk

      # Smaller, optimised build: only for main or when started by hand.
      - name: Build release APK
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          name: RefBoard-release-apk
          path: app/build/outputs/apk/release/*.apk
